name: Markdown Lint

on:
  push:
    paths:
      - 'docs/**/*.md'
      - 'README.md'
  pull_request:
    paths:
      - 'docs/**/*.md'
      - 'README.md'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: 'docs/**/*.md'
